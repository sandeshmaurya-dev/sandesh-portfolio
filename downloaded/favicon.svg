	<circle cx="16" cy="16" r="9.9" fill="none" stroke="#9a9aa4" stroke-width="1.5" />
	<ellipse
		cx="16"
		cy="16"
		rx="15"
		ry="4.1"
		fill="none"
		stroke="#9a9aa4"
		stroke-width="1.6"
		transform="rotate(-14 16 16)"
	/>
</svg>
